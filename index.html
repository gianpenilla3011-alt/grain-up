@media print{nav,.np,.toast{display:none!important}body{background:#fff;color:#000}}

{id:"pancake",n:"Pancake classici",cat:"pancake",cl:"Pancake",t:20,d:"Facile",s:4,e:"🥞",ing:[["farina","f00",200,"g"],["latte","latte",250,"ml"],["uova","uovo",2,"pcs"],["zucchero","zucchero",30,"g"],["grasso","burro",30,"g"],["lievito","lievito",10,"g"]],

return L.length?`<div class="grid">${L.map(cardR).join("")}</div>`:`<p>Nessuna ricetta trovata. Prova un altro termine o rimuovi i filtri.</p>`}
function esplora(){return`<h1>Esplora le ricette</h1><div class="srch" id="flt"><input id="q" type="search" value="${S.q}" placeholder="Nome, ingrediente o categoria" aria-label="Cerca">
<select id="fc" aria-label="Categoria"><option value="">Tutte le categorie</option>${CATS.map(c=>`<option ${S.f.c==c?"selected":""}>${c}</option>`).join("")}</select>
<select id="ft" aria-label="Tempo"><option value="">Qualsiasi tempo</option><option value="30" ${S.f.t=="30"?"selected":""}>Fino a 30 min</option><option value="60" ${S.f.t=="60"?"selected":""}>Fino a 60 min</option></select>
<select id="fd" aria-label="Difficoltà"><option value="">Ogni difficoltà</option><option ${S.f.d=="Facile"?"selected":""}>Facile</option><option ${S.f.d=="Media"?"selected":""}>Media</option></select></div><div id="res">${resList()}</div>
<p class="note">Il filtro per preferenze alimentari non è ancora attivo: richiede più ricette nel catalogo.</p>`}
function lab(){const rc=rec(S.rid),rw=rows(rc,S.sub,S.serv),w=warns(rc,S.sub,S.serv),ns=Object.keys(S.sub).length;
return`<h1>Il laboratorio</h1><div class="bar"><b>${rc.n}</b><select id="rsel" aria-label="Ricetta">${RC.map(x=>`<option value="${x.id}" ${x.id==S.rid?"selected":""}>${x.n}</option>`).join("")}</select>
<span>Porzioni <button data-a="serv" data-v="-1" aria-label="Meno porzioni">−</button> <b>${S.serv}</b> <button data-a="serv" data-v="1" aria-label="Più porzioni">+</button></span><span class="tag">⏱ ${rc.t} min</span><span class="tag">${rc.d}</span>
<button data-a="undo" ${S.hist.length?"":"disabled"}>↶ Annulla</button><button data-a="reset" ${ns?"":"disabled"}>Ripristina originale</button><button class="sec" data-a="save">Salva</button></div>
<div class="lab"><div class="table" role="group" aria-label="Tavolo degli ingredienti">${rw.map(x=>`<button class="tile ${x.sw?"chg":""} ${S.last==x.s?"pop":""}" data-a="open" data-s="${x.s}" aria-label="Modifica ${I[x.cur][0]}, ${qs(x)}">${ph(x.cur)}<b>${I[x.cur][0]}</b><span>${qs(x)}</span>${x.sw?`<small>sostituito ✓ (era ${I[x.o][0]})</small>`:`<small class="note">Tocca per cambiare</small>`}</button>`).join("")}</div>
<aside class="sum" aria-label="Riepilogo"><h2>Riepilogo</h2><p><b>Sostituzioni:</b> ${ns?ns+" applicate":"nessuna (ricetta originale)"}</p><ul>${rw.map(x=>`<li>${qs(x)} ${I[x.cur][0]}${x.sw?" ✎":""}</li>`).join("")}</ul>
${w.map(t=>`<div class="warn">⚠ ${t}</div>`).join("")}${ntab(rc,S.sub,S.serv)}<p><a class="btn pri" href="#ricetta">Visualizza la ricetta aggiornata</a></p></aside></div>${S.open?drawer(rc):""}`}
function drawer(rc){const sl=rc.ing.find(x=>x[0]==S.open),cur=S.sub[S.open]||sl[1],x=rows(rc,S.sub,S.serv).find(y=>y.s==S.open),sel=S.pick||cur,rule=sel!=sl[1]?find(rc,sl[1],sel):null;
let comp,qtxt="";if(sel==cur)comp=sel==sl[1]?"✔ Ingrediente originale della ricetta":"● Selezione attuale";else if(sel==sl[1])comp="✔ Torna all’originale";else if(rule){comp=rule.l=="alta"?"✔ Sostituzione ben supportata":"⚠ Parzialmente compatibile";const q=rd(sl[3]=="pcs"?sl[2]*S.serv/rc.s*(rule.pu?1:1):sl[2]*S.serv/rc.s,sl[3]);qtxt=rule.pu?`${fx(rd(sl[2]*S.serv/rc.s*rule.pu,"g"))} g`:`${fx(rd(sl[2]*S.serv/rc.s*rule.k,sl[3]))} ${sl[3]=="pcs"?"uova":sl[3]}`}else comp="? Non verificata: nessuna regola affidabile. La quantità resta invariata e il risultato non è garantito.";
return`<div class="drawer" role="dialog" aria-modal="true" aria-label="Alternative per ${GN[I[sl[1]][2]]}"><button data-a="close" style="float:right">✕ Chiudi</button><h2>${GN[I[sl[1]][2]]}</h2><div style="text-align:center;font-size:4.5rem" aria-hidden="true">${I[cur][1]}</div><p style="text-align:center"><b>${I[cur][0]}</b> · ${qs(x)}</p>
<div class="alts">${Object.keys(I).filter(k=>I[k][2]==I[sl[1]][2]).map(k=>`<button class="alt" data-a="pick" data-id="${k}" aria-pressed="${k==sel}">${ph(k)}<span>${I[k][0]}</span></button>`).join("")}</div>
<div class="detail"><h3>${I[sel][0]}</h3><p>${I[sel][4]}</p><p><b>${comp}</b></p>${qtxt?`<p>Quantità suggerita: <b>${qtxt}</b></p>`:""}${rule&&rule.w?`<div class="warn">⚠ ${rule.w}</div>`:""}<p class="note">Per 100 g: ${I[sel][3][0]} kcal · ${I[sel][3][4]} g grassi · ${I[sel][3][2]} g carboidrati</p></div>
<p><button class="pri" data-a="apply" ${sel==cur?"disabled":""}>Applica sostituzione</button> <button data-a="close">Indietro senza modifiche</button></p></div>`}
function ricetta(){const rc=rec(S.rid),rw=rows(rc,S.sub,S.serv),w=warns(rc,S.sub,S.serv),ns=Object.keys(S.sub).length;
return`<div class="rc"><h1>La tua ricetta: ${rc.n}${ns?" (variante)":""}</h1><div class="bar np"><a class="btn" href="#lab/${rc.id}">← Torna al laboratorio</a><button data-a="print">🖨 Stampa</button><button class="sec" data-a="save">Salva</button><button data-a="reset" ${ns?"":"disabled"}>Ripristina originale</button></div>
<p><span class="tag">${S.serv} porzioni</span><span class="tag">⏱ ${rc.t} min</span><span class="tag">${rc.d}</span></p><p class="note">Foto di riferimento: ${rc.e} immagine della ricetta originale, non una simulazione della variante. Nessuna immagine è stata generata.</p>
${w.map(t=>`<div class="warn">⚠ ${t}</div>`).join("")}<h2>Ingredienti</h2><ul style="list-style:none;padding:0">${rw.map((x,i)=>`<li><label><input type="checkbox"> <b>${qs(x)}</b> ${I[x.cur][0]}${x.sw?` <span class="note">(al posto di ${I[x.o][0]}; originale: ${fx(rec(S.rid).ing[i][2]*S.serv/rc.s)} ${rc.ing[i][3]=="pcs"?"uova":rc.ing[i][3]})</span>`:""}${x.q!=rc.ing[i][2]*S.serv/rc.s&&!x.sw&&x.u=="pcs"?` <span class="note">(arrotondato: usa uova intere)</span>`:""}</label></li>`).join("")}</ul>
<h2>Procedimento</h2><ol>${rc.st.map(([t,sl])=>{const n=sl.split(" ").map(k=>rw.find(x=>x.s==k)).filter(x=>x&&x.rule&&x.rule.sn).map(x=>x.rule.sn);return`<li>${t}${n.map(m=>`<div class="warn">✎ ${m}</div>`).join("")}</li>`}).join("")}</ol>
<h2>Valori nutrizionali stimati</h2>${ntab(rc,S.sub,S.serv)}</div>`}
function mie(){let L=[];try{L=JSON.parse(localStorage.getItem("gu")||"[]")}catch(e){}
return`<h1>Le mie ricette</h1>${L.length?`<div class="grid">${L.map(x=>`<div class="card"><div class="ph">${rec(x.rid).e}</div><h3>${rec(x.rid).n}</h3><p class="note">${Object.values(x.sub).map(i=>I[i][0]).join(", ")||"Originale"} · ${x.serv} porzioni</p><button class="pri" data-a="load" data-id="${x.id}">Apri</button> <button data-a="del" data-id="${x.id}">Elimina</button></div>`).join("")}</div>`:`<p>Non hai ancora salvato nessuna ricetta. Apri il <a href="#lab/pancake">laboratorio</a>, modifica una ricetta e premi “Salva”.</p>`}
<p class="note">Il salvataggio avviene solo in questo browser. Account, preferiti, cronologia e sincronizzazione richiedono un backend (es. Supabase) non ancora configurato.</p>`}
function render(){const [p,a]=location.hash.slice(1).split("/");const m=$("#app");
if(p=="lab"){if(a&&rec(a)&&a!=S.rid){Object.assign(S,{rid:a,sub:{},hist:[],serv:rec(a).s,open:null})}m.innerHTML=lab()}
else if(p=="ricetta")m.innerHTML=ricetta();else if(p=="esplora"){if(a)S.f.c=decodeURIComponent(a);m.innerHTML=esplora()}else if(p=="mie")m.innerHTML=mie();else m.innerHTML=home();
if(p!="lab")window.scrollTo(0,0)}
addEventListener("hashchange",render);
const ch=()=>{S.hist.push({...S.sub})};
document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a,d=b.dataset,rc=rec(S.rid);
if(a=="open"){S.open=d.s;S.pick=null}
else if(a=="close"){S.open=null}
else if(a=="pick")S.pick=d.id;
else if(a=="apply"){ch();const o=rc.ing.find(x=>x[0]==S.open)[1];if(S.pick==o)delete S.sub[S.open];else S.sub[S.open]=S.pick;S.last=S.open;S.open=null;S.pick=null;toast("Sostituzione applicata")}
else if(a=="undo"){S.sub=S.hist.pop()||{};S.last=null;toast("Ultima modifica annullata")}
else if(a=="reset"){ch();S.sub={};S.serv=rc.s;S.last=null;toast("Ricetta originale ripristinata")}
else if(a=="serv"){S.serv=Math.min(24,Math.max(1,S.serv+ +d.v));S.last=null}
else if(a=="save"){let L=[];try{L=JSON.parse(localStorage.getItem("gu")||"[]");L.push({id:Date.now()+"",rid:S.rid,sub:S.sub,serv:S.serv});localStorage.setItem("gu",JSON.stringify(L));toast("Salvata in “Le mie ricette” (solo su questo browser)")}catch(x){toast("Salvataggio non disponibile in questo ambiente")}return}
else if(a=="load"){let L=JSON.parse(localStorage.getItem("gu")||"[]"),x=L.find(y=>y.id==d.id);if(x){Object.assign(S,{rid:x.rid,sub:x.sub,serv:x.serv,hist:[],open:null});location.hash="lab/"+x.rid}return}
else if(a=="del"){try{let L=JSON.parse(localStorage.getItem("gu")||"[]").filter(y=>y.id!=d.id);localStorage.setItem("gu",JSON.stringify(L))}catch(x){}render();toast("Ricetta eliminata");return}
else if(a=="print"){try{window.print()}catch(x){toast("Stampa non disponibile qui: usa Ctrl/Cmd+P")}return}
render()});
document.addEventListener("input",e=>{const t=e.target;if(t.id=="q"){S.q=t.value;$("#res").innerHTML=resList()}else if(["fc","ft","fd"].includes(t.id)){S.f={c:$("#fc").value,t:$("#ft").value,d:$("#fd").value};$("#res").innerHTML=resList()}
else if(t.id=="rsel"){Object.assign(S,{rid:t.value,sub:{},hist:[],serv:rec(t.value).s,open:null,last:null});render()}});
document.addEventListener("submit",e=>{if(e.target.id=="hs"){e.preventDefault();S.q=$("#hq").value;S.f={c:"",t:"",d:""};location.hash="esplora"}});
document.addEventListener("keydown",e=>{if(e.key=="Escape"&&S.open){S.open=null;render()}});
render();
</script></body></html>
