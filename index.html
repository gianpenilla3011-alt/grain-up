function dend(drop){if(!D)return;clearTimeout(D.timer);const d=D;D=null;if(!d.on)return;JD=true;setTimeout(()=>JD=false,80);d.g&&d.g.remove();d.t.classList.remove("dragging");document.querySelectorAll("[data-zone]").forEach(e=>e.classList.remove("over"));
if(!drop)return;const z=zoneAt(d.px,d.py);if(!z)return;
if(z.dataset.zone=="pl"&&d.from=="fr"){if(!S.pl.includes(d.id))S.pl.push(d.id);say(I[d.id][0]+" sul piano di lavoro");rf()}
else if(z.dataset.zone=="fr"&&d.from=="pl"){S.pl=S.pl.filter(x=>x!=d.id);say(I[d.id][0]+" rimesso nel frigo");rf()}}
document.addEventListener("pointerdown",e=>{const t=e.target.closest(".dr");if(!t||e.button>0)return;
D={id:t.dataset.id,from:t.dataset.from,t,x:e.clientX,y:e.clientY,px:e.clientX,py:e.clientY,on:false,touch:e.pointerType=="touch"};
if(D.touch)D.timer=setTimeout(dstart,260)});
document.addEventListener("pointermove",e=>{if(!D)return;D.px=e.clientX;D.py=e.clientY;
if(!D.on){const m=Math.hypot(D.px-D.x,D.py-D.y);if(D.touch){if(m>10){clearTimeout(D.timer);D=null}}else if(m>5)dstart()}else dmove()});
document.addEventListener("pointerup",e=>{if(D){D.px=e.clientX;D.py=e.clientY;dend(true)}});
document.addEventListener("pointercancel",()=>dend(false));
document.addEventListener("touchmove",e=>{if(D&&D.on)e.preventDefault()},{passive:false});
document.addEventListener("dragstart",e=>{if(e.target.closest&&e.target.closest(".dr"))e.preventDefault()});
document.addEventListener("toggle",e=>{if(e.target.classList&&e.target.classList.contains("pick"))S.po=e.target.open},true);
function render(){const [p,a]=location.hash.slice(1).split("/");const m=$("#app");
if(p=="lab"){if(a&&rec(a)&&a!=S.rid){Object.assign(S,{rid:a,sub:{},hist:[],serv:rec(a).s,open:null})}m.innerHTML=lab()}
else if(p=="ricetta")m.innerHTML=ricetta();else if(p=="esplora"){if(a)S.f.c=decodeURIComponent(a);m.innerHTML=esplora()}else if(p=="mie")m.innerHTML=mie();else if(p=="frigo")m.innerHTML=frigo();else m.innerHTML=home();
document.querySelectorAll("nav a[data-p]").forEach(l=>{if(l.dataset.p==(p||"home")||(p=="ricetta"&&l.dataset.p=="lab"))l.setAttribute("aria-current","page");else l.removeAttribute("aria-current")});
if(p!="lab")window.scrollTo(0,0)}
addEventListener("hashchange",render);
const ch=()=>{S.hist.push({...S.sub})};
document.addEventListener("click",e=>{if(JD)return;const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a,d=b.dataset,rc=rec(S.rid);
if(FA(a,d))return;
if(a=="open"){S.open=d.s;S.pick=null}
else if(a=="close"){S.open=null}
else if(a=="pick")S.pick=d.id;
else if(a=="apply"){ch();const o=rc.ing.find(x=>x[0]==S.open)[1];if(S.pick==o)delete S.sub[S.open];else S.sub[S.open]=S.pick;S.last=S.open;S.open=null;S.pick=null;toast("Sostituzione applicata")}
else if(a=="undo"){S.sub=S.hist.pop()||{};S.last=null;toast("Ultima modifica annullata")}
else if(a=="reset"){ch();S.sub={};S.serv=rc.s;S.last=null;toast("Ricetta originale ripristinata")}
else if(a=="serv"){S.serv=Math.min(24,Math.max(1,S.serv+ +d.v));S.last=null}
else if(a=="save"){let L=[];try{L=JSON.parse(localStorage.getItem("gu")||"[]");L.push({id:Date.now()+"",rid:S.rid,sub:S.sub,serv:S.serv});localStorage.setItem("gu",JSON.stringify(L));toast("Salvata in “Le mie ricette” (solo su questo browser)")}catch(x){toast("Salvataggio non disponibile in questo ambiente")}return}
else if(a=="load"){let L=JSON.parse(localStorage.getItem("gu")||"[]"),x=L.find(y=>y.id==d.id);if(x){Object.assign(S,{rid:x.rid,sub:x.sub,serv:x.serv,hist:[],open:null});location.hash="lab/"+x.rid}return}
else if(a=="del"){try{let L=JSON.parse(localStorage.getItem("gu")||"[]").filter(y=>y.id!=d.id);localStorage.setItem("gu",JSON.stringify(L))}catch(x){}render();toast("Ricetta eliminata");return}
else if(a=="print"){try{window.print()}catch(x){toast("Stampa non disponibile qui: usa Ctrl/Cmd+P")}return}
render()});
document.addEventListener("input",e=>{const t=e.target;if(t.id=="q"){S.q=t.value;$("#res").innerHTML=resList()}else if(["fc","ft","fd"].includes(t.id)){S.f={c:$("#fc").value,t:$("#ft").value,d:$("#fd").value};$("#res").innerHTML=resList()}
else if(t.id=="rsel"){Object.assign(S,{rid:t.value,sub:{},hist:[],serv:rec(t.value).s,open:null,last:null});render()}});
document.addEventListener("submit",e=>{if(e.target.id=="hs"){e.preventDefault();S.q=$("#hq").value;S.f={c:"",t:"",d:""};location.hash="esplora"}});
document.addEventListener("keydown",e=>{if(e.key=="Escape"&&S.open){S.open=null;render()}});
render();
</script></body></html>
